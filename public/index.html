<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deer's Rock — Hospital Dashboard</title>
<style>
  :root {
    --bg: #0b0e14;
    --surface: #141a24;
    --surface2: #1c2432;
    --border: #2a3444;
    --text: #e2e8f0;
    --muted: #8896a6;
    --accent: #38bdf8;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #ef4444;
    --orange: #fb923c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    font-size: 13px;
    line-height: 1.5;
  }
  .container { max-width: 1400px; margin: 0 auto; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 20px;
  }
  .header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .header h1 span { color: var(--accent); }
  .header .time { color: var(--muted); font-size: 14px; }
  .header .tick { color: var(--yellow); font-size: 14px; }

  /* Stats Cards */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; text-align: center;
  }
  .card .value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .card.accent .value { color: var(--accent); }
  .card.green .value { color: var(--green); }
  .card.yellow .value { color: var(--yellow); }
  .card.orange .value { color: var(--orange); }
  .card.red .value { color: var(--red); }

  /* Grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

  /* Panel */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .panel-header {
    padding: 10px 16px; background: var(--surface2); border-bottom: 1px solid var(--border);
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-body { padding: 12px 16px; max-height: 360px; overflow-y: auto; }
  .panel-body table { width: 100%; border-collapse: collapse; }
  .panel-body th {
    text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface);
  }
  .panel-body td { padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .panel-body tr:hover td { background: var(--surface2); }

  /* Ward Bars */
  .ward-list { display: flex; flex-direction: column; gap: 8px; }
  .ward-row { display: flex; align-items: center; gap: 10px; }
  .ward-name { width: 140px; font-size: 12px; color: var(--text); flex-shrink: 0; }
  .ward-bar-bg { flex: 1; height: 20px; background: var(--surface2); border-radius: 4px; overflow: hidden; position: relative; }
  .ward-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .ward-label { font-size: 11px; color: var(--muted); width: 60px; text-align: right; flex-shrink: 0; }

  /* Feed */
  .feed { display: flex; flex-direction: column; gap: 4px; }
  .feed-item { font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
  .feed-item .id { color: var(--muted); width: 100px; flex-shrink: 0; }
  .feed-item .event { flex: 1; }
  .feed-item .event.admission { color: var(--green); }
  .feed-item .event.discharge { color: var(--orange); }
  .feed-item .time { color: var(--muted); width: 80px; text-align: right; }

  /* Badge */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;
  }
  .badge.active { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge.discharged { background: rgba(251,146,60,0.15); color: var(--orange); }
  .badge.emergency { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge.admission { background: rgba(56,189,248,0.15); color: var(--accent); }

  .full { grid-column: 1 / -1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .search-box {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  .search-box input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 12px; color: var(--text); font-family: inherit; font-size: 12px; outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }

  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .header { flex-direction: column; gap: 8px; text-align: center; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🦌 <span>Deer's Rock</span> Hospital</h1>
    <div>
      <span class="time" id="hospitalTime">--:--</span>
      &nbsp;|&nbsp;
      <span class="tick">tick <span id="tick">0</span></span>
    </div>
  </div>

  <div class="stats" id="stats">
    <div class="card accent"><div class="value" id="statPatients">0</div><div class="label">Patients</div></div>
    <div class="card green"><div class="value" id="statEncounters">0</div><div class="label">Active Encounters</div></div>
    <div class="card yellow"><div class="value" id="statBeds">0</div><div class="label">Available Beds</div></div>
    <div class="card orange"><div class="value" id="statWaiting">0</div><div class="label">Waiting Room</div></div>
    <div class="card" style="opacity:0.7"><div class="value" id="statTotalBeds">0</div><div class="label">Total Beds</div></div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-header">Bed Occupancy by Ward</div>
      <div class="panel-body"><div class="ward-list" id="wardList"></div></div>
    </div>
    <div class="panel">
      <div class="panel-header">Active Encounters <span id="encounterCount" style="color:var(--green)">0</span></div>
      <div class="panel-body"><div id="encounterList"></div></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel full">
      <div class="panel-header">
        <span>Patient Directory</span>
        <span style="font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px">search by name or ID</span>
      </div>
      <div class="panel-body">
        <div class="search-box">
          <input type="text" id="patientSearch" placeholder="Search patients..." oninput="renderPatients()">
        </div>
        <div style="overflow-x:auto"><table><thead><tr>
          <th>ID</th><th>Name</th><th>Age</th><th>Gender</th>
          <th>HR</th><th>BP</th><th>SpO₂</th><th>Temp</th><th>Diagnoses</th>
        </tr></thead><tbody id="patientTable"></tbody></table></div>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="panel full">
      <div class="panel-header">Recent Activity Feed</div>
      <div class="panel-body"><div class="feed" id="feed"></div></div>
    </div>
  </div>
</div>

<script>
const API = '';

async function get(path) {
  const r = await fetch(API + path);
  return r.json();
}

function fmtTime(startMs) {
  const m = Math.floor(startMs / 60000);
  const h = Math.floor(m / 60) % 24;
  const d = Math.floor(m / 1440);
  const min = m % 60;
  return d > 0
    ? `Day ${d} ${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`
    : `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
}

let lastEncounterCount = 0;
let lastPatients = [];

function getWardColor(pct) {
  if (pct >= 80) return '#ef4444';
  if (pct >= 60) return '#fb923c';
  if (pct >= 40) return '#facc15';
  return '#4ade80';
}

async function refresh() {
  const [status, patients, bedsData, encounters, feedData] = await Promise.all([
    get('/api/status'),
    get('/api/patients'),
    get('/api/beds'),
    get('/api/encounters'),
    get('/api/feed'),
  ]);

  // Header
  document.getElementById('hospitalTime').textContent = status.time;
  document.getElementById('tick').textContent = status.tick;

  // Stats
  document.getElementById('statPatients').textContent = status.patients;
  document.getElementById('statEncounters').textContent = status.activeEncounters;
  document.getElementById('statBeds').textContent = status.availableBeds;
  document.getElementById('statWaiting').textContent = status.waitingRoom;
  document.getElementById('statTotalBeds').textContent = status.totalBeds;

  // Ward occupancy
  const wardHtml = Object.entries(bedsData.byWard).map(([ward, info]) => {
    const pct = info.total > 0 ? Math.round((info.occupied / info.total) * 100) : 0;
    return `<div class="ward-row">
      <div class="ward-name">${ward}</div>
      <div class="ward-bar-bg">
        <div class="ward-bar-fill" style="width:${pct}%;background:${getWardColor(pct)}"></div>
      </div>
      <div class="ward-label">${info.occupied}/${info.total}</div>
    </div>`;
  }).join('');
  document.getElementById('wardList').innerHTML = wardHtml;

  // Active encounters
  const activeEncounters = encounters.filter(e => e.status === 'active');
  document.getElementById('encounterCount').textContent = activeEncounters.length;
  if (activeEncounters.length === 0) {
    document.getElementById('encounterList').innerHTML = '<div style="color:var(--muted);padding:8px 0">No active encounters</div>';
  } else {
    const encHtml = '<table><thead><tr><th>ID</th><th>Patient</th><th>Type</th><th>Status</th><th>Start</th></tr></thead><tbody>'
      + activeEncounters.slice(0, 15).map(e => `<tr>
        <td style="color:var(--muted)">${e.id}</td>
        <td>${e.patientId}</td>
        <td><span class="badge ${e.type}">${e.type}</span></td>
        <td><span class="badge active">active</span></td>
        <td style="color:var(--muted)">${fmtTime(e.startTime)}</td>
      </tr>`).join('') + '</tbody></table>';
    document.getElementById('encounterList').innerHTML = encHtml;
    if (activeEncounters.length > 15) {
      document.getElementById('encounterList').innerHTML +=
        `<div style="color:var(--muted);padding:8px;text-align:center">... ${activeEncounters.length - 15} more</div>`;
    }
  }

  // Patient table
  lastPatients = patients;
  renderPatients();

  // Activity feed
  const recent = feedData.recentEncounters || [];
  if (recent.length > 0 && recent.length !== lastEncounterCount) {
    lastEncounterCount = recent.length;
    const feedHtml = recent.slice(0, 20).map(e => {
      const type = e.status === 'active' ? 'admission' : 'discharge';
      return `<div class="feed-item">
        <span class="id">${e.id}</span>
        <span class="event ${type}">${type === 'admission' ? '🟢 Admitted' : '🟠 Discharged'} — ${e.patientId} (${e.type})</span>
        <span class="time">${fmtTime(e.status === 'active' ? e.startTime : (e.endTime || e.startTime))}</span>
      </div>`;
    }).join('');
    document.getElementById('feed').innerHTML = feedHtml;
  }
}

function renderPatients() {
  const q = (document.getElementById('patientSearch').value || '').toLowerCase();
  const filtered = q ? lastPatients.filter(p =>
    p.id.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)
  ) : lastPatients;

  const rows = filtered.slice(0, 50).map(p => `<tr>
    <td style="color:var(--accent)">${p.id}</td>
    <td>${p.name}</td>
    <td>${p.age}</td>
    <td>${p.gender}</td>
    <td>${p.vitals.heartRate}</td>
    <td>${p.vitals.bloodPressureSystolic}/${p.vitals.bloodPressureDiastolic}</td>
    <td>${p.vitals.oxygenSaturation}%</td>
    <td>${p.vitals.temperature}°C</td>
    <td style="color:var(--muted);font-size:11px">${p.diagnoses.map(d => d.name).join(', ')}</td>
  </tr>`).join('');
  document.getElementById('patientTable').innerHTML = rows
    || '<tr><td colspan="9" style="color:var(--muted);text-align:center;padding:16px">No patients found</td></tr>';
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
