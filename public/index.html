<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deer's Rock — Hospital Dashboard</title>
<style>
  :root { --bg:#0b0e14;--surface:#141a24;--surface2:#1c2432;--border:#2a3444;--text:#e2e8f0;--muted:#8896a6;--accent:#38bdf8;--green:#4ade80;--yellow:#facc15;--red:#ef4444;--orange:#fb923c;--purple:#a78bfa;--pink:#f472b6;--teal:#2dd4bf;--rose:#fb7185; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'SF Mono','Cascadia Code','Consolas',monospace;background:var(--bg);color:var(--text);padding:8px;font-size:11px;line-height:1.5}
  .container{max-width:1700px;margin:0 auto}
  .header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
  .header h1{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .header h1 span{color:var(--accent)}.header .meta{display:flex;gap:10px;font-size:10px;color:var(--muted)}
  .header .meta .val{color:var(--yellow)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:4px;margin-bottom:6px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:6px 4px;text-align:center}
  .card .value{font-size:15px;font-weight:700}
  .card .label{color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px;margin-bottom:6px}
  .full{grid-column:1/-1}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .panel-header{padding:5px 8px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .panel-body{padding:5px 8px;max-height:200px;overflow-y:auto}
  .panel-body table{width:100%;border-collapse:collapse}
  .panel-body th{text-align:left;font-size:7px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:2px 3px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
  .panel-body td{padding:2px 3px;border-bottom:1px solid var(--border);font-size:9px}
  .panel-body tr:hover td{background:var(--surface2)}
  .ward-list{display:flex;flex-direction:column;gap:3px}
  .ward-row{display:flex;align-items:center;gap:4px}
  .ward-name{width:80px;font-size:9px;flex-shrink:0}
  .ward-bar-bg{flex:1;height:12px;background:var(--surface2);border-radius:2px;overflow:hidden}
  .ward-bar-fill{height:100%;border-radius:2px;transition:width .5s}
  .ward-label{font-size:8px;color:var(--muted);width:35px;text-align:right;flex-shrink:0}
  .feed{display:flex;flex-direction:column;gap:2px}
  .feed-item{font-size:9px;padding:2px 0;border-bottom:1px solid var(--border);display:flex;gap:5px}
  .feed-item .id{color:var(--muted);width:50px;flex-shrink:0;font-size:8px}
  .feed-item .event{flex:1}.feed-item .time{color:var(--muted);width:50px;text-align:right;flex-shrink:0;font-size:8px}
  .badge{display:inline-block;padding:1px 4px;border-radius:2px;font-size:7px;font-weight:600}
  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-track{background:var(--surface)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div class=container>
  <div class=header>
    <h1>🦌 <span>Deer's Rock</span> Hospital</h1>
    <div class=meta><span>Time: <span class=val id=hTime>--:--</span></span><span>Tick: <span class=val id=hTick>0</span></span></div>
  </div>

  <div class=stats id=stats></div>

  <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px;margin-bottom:6px">
    <div class=panel><div class=panel-header>🛏️ Bed Occupancy</div><div class=panel-body><div class=ward-list id=wardList></div></div></div>
    <div class=panel><div class=panel-header>🚑 Emergency Dept <span id=edCount style=color:var(--red)>0</span></div><div class=panel-body><div id=edList></div></div></div>
  </div>

  <div class=grid>
    <div class=panel><div class=panel-header>🧪 Lab <span id=labCount style=color:var(--purple)>0</span></div><div class=panel-body><div id=labList></div></div></div>
    <div class=panel><div class=panel-header>📡 Radiology <span id=radCount style=color:var(--pink)>0</span></div><div class=panel-body><div id=radList></div></div></div>
    <div class=panel><div class=panel-header>💊 Pharmacy <span id=medCount style=color:var(--teal)>0</span></div><div class=panel-body><div id=medList></div></div></div>
    <div class=panel><div class=panel-header>🔪 Surgery <span id=surgCount style=color:var(--rose)>0</span></div><div class=panel-body><div id=surgList></div></div></div>
    <div class=panel><div class=panel-header>🩺 Nursing <span id=nurseCount style=color:var(--accent)>0</span></div><div class=panel-body><div id=nurseList></div></div></div>
    <div class=panel><div class=panel-header>📋 Physician Orders <span id=docCount style=color:var(--green)>0</span></div><div class=panel-body><div id=docList></div></div></div>
    <div class=panel><div class=panel-header>💨 Respiratory <span id=respCount style=color:var(--yellow)>0</span></div><div class=panel-body><div id=respList></div></div></div>
    <div class=panel><div class=panel-header>🍽️ Dietary <span id=dietCount style=color:var(--orange)>0</span></div><div class=panel-body><div id=dietList></div></div></div>
    <div class=panel><div class=panel-header>🤝 Social Work <span id=socialCount style=color:var(--muted)>0</span></div><div class=panel-body><div id=socialList></div></div></div>
    <div class=panel><div class=panel-header>📁 Medical Records <span id=chartCount style=color:var(--purple)>0</span></div><div class=panel-body><div id=chartList></div></div></div>
    <div class=panel><div class=panel-header>💰 Finance <span id=finCount style=color:var(--green)>0</span></div><div class=panel-body><div id=finList></div></div></div>
    <div class=panel><div class=panel-header>📦 Inventory <span id=invCount style=color:var(--yellow)>0</span></div><div class=panel-body><div id=invList></div></div></div>
  </div>

  <div class="panel full"><div class=panel-header>📊 Activity Feed</div><div class=panel-body style=max-height:140px><div class=feed id=feed></div></div></div>
</div>

<script>
function fmtTime(ms){const m=Math.floor(ms/60000),h=Math.floor(m/60)%24,d=Math.floor(m/1440);return d>0?`Day ${d} ${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`:`${String(h).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`}
function wc(p){return p>=80?'#ef4444':p>=60?'#fb923c':p>=40?'#facc15':'#4ade80'}

async function refresh(){
try{
const[s,beds,enc,labs,rad,meds,surg,nursing,docs,ed,resp,diet,social,charts,charges,claims,pays,inv]=await Promise.all([
  fetch('/api/status').then(r=>r.json()),fetch('/api/beds').then(r=>r.json()),fetch('/api/encounters').then(r=>r.json()),
  fetch('/api/labs').then(r=>r.json()),fetch('/api/radiology').then(r=>r.json()),fetch('/api/medications').then(r=>r.json()),
  fetch('/api/surgery').then(r=>r.json()),fetch('/api/nursing').then(r=>r.json()),fetch('/api/orders').then(r=>r.json()),
  fetch('/api/emergency').then(r=>r.json()),fetch('/api/respiratory').then(r=>r.json()),fetch('/api/diet').then(r=>r.json()),
  fetch('/api/social').then(r=>r.json()),fetch('/api/charts').then(r=>r.json()),fetch('/api/charges').then(r=>r.json()),
  fetch('/api/claims').then(r=>r.json()),fetch('/api/payments').then(r=>r.json()),fetch('/api/inventory/low').then(r=>r.json()),
]);

document.getElementById('hTime').textContent=s.time;document.getElementById('hTick').textContent=s.tick;

const statMap=[
  ['👥 Patients',s.patients,'--accent'],['🚑 Encounters',s.activeEncounters,'--green'],['🛏️ Beds Free',s.availableBeds,'--yellow'],
  ['⏳ Waiting',s.waitingRoom,'--orange'],['🆘 ED',s.edTriages,'--red'],['🧪 Lab',s.labOrders,'--purple'],
  ['📡 Rad',s.radiologyOrders,'--pink'],['💊 Meds',s.medicationOrders,'--teal'],['🔪 OR',s.surgeryOrders,'--rose'],
  ['🩺 Nursing',s.nurseNotes,'--accent'],['📋 Orders',s.physicianOrders,'--green'],['💨 Resp',s.respiratoryOrders,'--yellow'],
  ['🍽️ Diet',s.dietOrders,'--orange'],['🤝 Social',s.socialWorkNotes,'--muted'],['📁 Charts',s.medicalCharts,'--purple'],
  ['💰 Charges',s.charges,'--green'],['📄 Claims',s.insuranceClaims,'--teal'],['📦 Stock',inv.length,'--red'],
];
document.getElementById('stats').innerHTML=statMap.map(([l,v,c])=>`<div class=card><div class=value style=color:var(${c})>${v}</div><div class=label>${l}</div></div>`).join('');

function render(id,cid,items,l1,l2,fn,mx=4){const e=document.getElementById(id);document.getElementById(cid).textContent=items.length;
e.innerHTML=items.length===0?'<div style=color:var(--muted);padding:4px>—</div>'
:'<table><thead><tr><th>'+l1+'</th><th>'+l2+'</th></tr></thead><tbody>'+items.slice(0,mx).map(fn).join('')+'</tbody></table>';}

render('labList','labCount',labs,'Test','Status',o=>`<tr><td style=font-size:8px>${o.testName}</td><td><span class=badge style=background:${o.status==='resulted'?'rgba(74,222,128,0.15)':'rgba(251,191,36,0.15)'};color:${o.status==='resulted'?'var(--green)':'var(--yellow)'}>${o.status}</span></td></tr>`);
render('radList','radCount',rad,'Study','Status',o=>`<tr><td style=font-size:8px>${o.studyType.replace('Chest X-ray PA & Lateral','CXR').replace('Ultrasound','US')}</td><td><span class=badge style=background:${o.status==='resulted'?'rgba(74,222,128,0.15)':'rgba(251,191,36,0.15)'};color:${o.status==='resulted'?'var(--green)':'var(--yellow)'}>${o.status}</span></td></tr>`);
render('medList','medCount',meds,'Med','Status',o=>`<tr><td style=font-size:8px>${o.medication.name}</td><td><span class=badge style=background:${o.status==='administered'?'rgba(74,222,128,0.15)':'rgba(251,191,36,0.15)'};color:${o.status==='administered'?'var(--green)':'var(--yellow)'}>${o.status}</span></td></tr>`);
render('surgList','surgCount',surg,'Procedure','Status',o=>`<tr><td style=font-size:8px>${o.procedureName.replace('Laparoscopic ','Lap ').replace('Total ','')}</td><td><span class=badge style=background:${o.status==='completed'?'rgba(74,222,128,0.15)':'rgba(56,189,248,0.15)'};color:${o.status==='completed'?'var(--green)':'var(--accent)'}>${o.status}</span></td></tr>`);
render('nurseList','nurseCount',nursing,'Observation','Patient',n=>`<tr><td style=font-size:7px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap>${n.content}</td><td>${n.patientId}</td></tr>`,3);
render('docList','docCount',docs,'Order','Status',o=>`<tr><td style=font-size:8px>${o.description}</td><td><span class=badge style=background:${o.status==='completed'?'rgba(74,222,128,0.15)':'rgba(56,189,248,0.15)'};color:${o.status==='completed'?'var(--green)':'var(--accent)'}>${o.status}</span></td></tr>`);
render('respList','respCount',resp,'Therapy','Status',o=>`<tr><td style=font-size:8px>${o.therapyType}</td><td><span class=badge style=background:rgba(251,191,36,0.15);color:var(--yellow)>${o.status}</span></td></tr>`);
render('dietList','dietCount',diet,'Diet','Status',o=>`<tr><td style=font-size:8px>${o.dietType}</td><td><span class=badge style=background:rgba(74,222,128,0.15);color:var(--green)>${o.status}</span></td></tr>`);
render('socialList','socialCount',social,'Note','Type',o=>`<tr><td style=font-size:7px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap>${o.content}</td><td style=font-size:8px>${o.noteType}</td></tr>`,3);
render('chartList','chartCount',charts,'Patient','Status',o=>`<tr><td style=font-size:8px>${o.patientId}</td><td><span class=badge style=background:${o.status==='coded'?'rgba(74,222,128,0.15)':'rgba(251,191,36,0.15)'};color:${o.status==='coded'?'var(--green)':'var(--yellow)'}>${o.status}</span></td></tr>`);
render('finList','finCount',charges,'Charge','Amount',o=>`<tr><td style=font-size:8px>${o.description}</td><td style=color:var(--yellow)>Rp ${o.amount.toLocaleString()}</td></tr>`,3);
render('invList','invCount',inv,'Item','Stock',o=>`<tr><td style=font-size:8px>${o.itemName}</td><td style=color:var(--red)>${o.stock}/${o.minStock}</td></tr>`);

// Wards
const wh=Object.entries(beds.byWard).map(([w,i])=>{const p=i.total>0?Math.round((i.occupied/i.total)*100):0;return`<div class=ward-row><div class=ward-name>${w}</div><div class=ward-bar-bg><div class=ward-bar-fill style="width:${p}%;background:${wc(p)}"></div></div><div class=ward-label>${i.occupied}/${i.total}</div></div>`}).join('');
document.getElementById('wardList').innerHTML=wh||'<div style=color:var(--muted)>—</div>';

// ED
const ae=ed.filter(t=>!t.disposition);
document.getElementById('edCount').textContent=ae.length;
document.getElementById('edList').innerHTML=ae.length===0?'<div style=color:var(--muted)>—</div>':'<table><thead><tr><th>Patient</th><th>Complaint</th><th>Acuity</th></tr></thead><tbody>'+ae.slice(0,5).map(t=>`<tr><td>${t.patientId}</td><td style=font-size:8px>${t.chiefComplaint}</td><td><span class=badge style=background:${t.acuity<=2?'rgba(239,68,68,0.15)':'rgba(250,204,21,0.15)'};color:${t.acuity<=2?'var(--red)':'var(--yellow)'}>P${t.acuity}</span></td></tr>`).join('')+'</tbody></table>';

// Feed
const feed=[];
for(const e of enc.slice(-5))feed.push({id:e.id,t:e.status==='active'?`🚑 Admit ${e.patientId}`:`🟠 D/C ${e.patientId}`,time:fmtTime(e.status==='active'?e.startTime:(e.endTime||e.startTime))});
for(const o of rad.slice(-3))if(o.status==='resulted')feed.push({id:o.id,t:`📡 ${o.studyType.replace('Chest X-ray PA & Lateral','CXR').replace('Ultrasound','US')} done`,time:fmtTime(o.resultedAt||o.orderedAt)});
for(const o of surg.slice(-2))if(o.status==='completed')feed.push({id:o.id,t:`🔪 ${o.procedureName.replace('Laparoscopic ','Lap ')} done`,time:fmtTime(o.completedAt||o.scheduledAt)});
for(const o of labs.slice(-3))if(o.status==='resulted')feed.push({id:o.id,t:`🧪 ${o.testName} → ${o.result}`,time:fmtTime(o.resultedAt||o.orderedAt)});
for(const o of charts.slice(-2))if(o.status==='coded')feed.push({id:o.id,t:`📁 Chart coded for ${o.patientId}`,time:fmtTime(o.completedAt||o.createdAt)});
for(const o of pays.slice(-2))feed.push({id:o.id,t:`💰 Payment: Rp ${o.amount.toLocaleString()} (${o.type})`,time:fmtTime(o.paidAt)});
feed.sort((a,b)=>b.time.localeCompare(a.time));
document.getElementById('feed').innerHTML=feed.slice(0,10).map(f=>`<div class=feed-item><span class=id>${f.id.replace(/^([A-Z]+-?\d+).*/,'$1')}</span><span class=event>${f.t}</span><span class=time>${f.time}</span></div>`).join('')||'<div style=color:var(--muted)>—</div>';
}catch(e){}
}
refresh();setInterval(refresh,1000);
</script>
</body>
</html>
