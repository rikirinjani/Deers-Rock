<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Additive holiday influx modifiers">
  <rect width="680" height="430" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Additive holiday influx modifiers</text>

  <!-- axes -->
  <line x1="86" y1="340" x2="650" y2="340" stroke="#444" stroke-width="1.2"/>
  <line x1="86" y1="60" x2="86" y2="340" stroke="#444" stroke-width="1.2"/>

  <!-- y grid + ticks -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="86" y1="270" x2="650" y2="270"/>
    <line x1="86" y1="200" x2="650" y2="200"/>
    <line x1="86" y1="130" x2="650" y2="130"/>
    <line x1="86" y1="60" x2="650" y2="60"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="end">
    <text x="78" y="344">0</text>
    <text x="78" y="274">2</text>
    <text x="78" y="204">4</text>
    <text x="78" y="134">6</text>
    <text x="78" y="64">8</text>
  </g>

  <!-- bars -->
  <g fill="#2c7bb6">
    <rect x="116" y="165" width="66" height="175"/>
    <rect x="222" y="200" width="66" height="140"/>
    <rect x="328" y="235" width="66" height="105"/>
    <rect x="434" y="130" width="66" height="210"/>
    <rect x="540" y="200" width="66" height="140"/>
  </g>
  <g font-size="13" fill="#12324d" text-anchor="middle" font-weight="bold">
    <text x="149" y="158">5</text>
    <text x="255" y="193">4</text>
    <text x="361" y="228">3</text>
    <text x="467" y="123">6</text>
    <text x="573" y="193">4</text>
  </g>

  <!-- x labels -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="149" y="360">Ramadan</text><text x="149" y="375">dehydration</text>
    <text x="255" y="360">Ramadan</text><text x="255" y="375">gastritis</text>
    <text x="361" y="360">Ramadan</text><text x="361" y="375">hypoglycemia</text>
    <text x="467" y="360">Lebaran</text><text x="467" y="375">burns</text>
    <text x="573" y="360">Lebaran</text><text x="573" y="375">fractures</text>
  </g>

  <text x="26" y="200" font-size="12" fill="#555" text-anchor="middle" transform="rotate(-90 26 200)">Modifier (additive)</text>
</svg>
