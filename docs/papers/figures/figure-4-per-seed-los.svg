<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Per-seed mean length of stay, E1 experiment seeds 0 to 9">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Per-seed mean length of stay (E1, seeds 0&#8211;9)</text>

  <!-- axes -->
  <line x1="80" y1="340" x2="730" y2="340" stroke="#444" stroke-width="1.2"/>
  <line x1="80" y1="60" x2="80" y2="340" stroke="#444" stroke-width="1.2"/>

  <!-- y grid + ticks (0..110) -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="80" y1="289" x2="730" y2="289"/>
    <line x1="80" y1="238" x2="730" y2="238"/>
    <line x1="80" y1="187" x2="730" y2="187"/>
    <line x1="80" y1="136" x2="730" y2="136"/>
    <line x1="80" y1="85" x2="730" y2="85"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="end">
    <text x="72" y="344">0</text>
    <text x="72" y="293">22</text>
    <text x="72" y="242">44</text>
    <text x="72" y="191">66</text>
    <text x="72" y="140">88</text>
    <text x="72" y="89">110</text>
  </g>

  <!-- bars: values 78,67,85,81,80,78,74,88,95,103 ; scale 280/110 = 2.5455 px per unit -->
  <g fill="#2c7bb6">
    <rect x="102" y="141.5" width="42" height="198.5"/>
    <rect x="164" y="169.4" width="42" height="170.6"/>
    <rect x="226" y="123.6" width="42" height="216.4"/>
    <rect x="288" y="133.8" width="42" height="206.2"/>
    <rect x="350" y="136.4" width="42" height="203.6"/>
    <rect x="412" y="141.5" width="42" height="198.5"/>
    <rect x="474" y="151.7" width="42" height="188.3"/>
    <rect x="536" y="116.0" width="42" height="224.0"/>
    <rect x="598" y="98.2" width="42" height="241.8"/>
    <rect x="660" y="77.8" width="42" height="262.2"/>
  </g>
  <g font-size="12" fill="#12324d" text-anchor="middle">
    <text x="123" y="135">78</text>
    <text x="185" y="163">67</text>
    <text x="247" y="117">85</text>
    <text x="309" y="127">81</text>
    <text x="371" y="130">80</text>
    <text x="433" y="135">78</text>
    <text x="495" y="145">74</text>
    <text x="557" y="110">88</text>
    <text x="619" y="92">95</text>
    <text x="681" y="71">103</text>
  </g>

  <!-- x labels -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="123" y="358">0</text>
    <text x="185" y="358">1</text>
    <text x="247" y="358">2</text>
    <text x="309" y="358">3</text>
    <text x="371" y="358">4</text>
    <text x="433" y="358">5</text>
    <text x="495" y="358">6</text>
    <text x="557" y="358">7</text>
    <text x="619" y="358">8</text>
    <text x="681" y="358">9</text>
  </g>
  <text x="380" y="382" font-size="12" fill="#333" text-anchor="middle">Seed</text>
  <text x="26" y="200" font-size="12" fill="#555" text-anchor="middle" transform="rotate(-90 26 200)">Mean length of stay (ticks)</text>
</svg>
