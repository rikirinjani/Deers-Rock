<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Deers Rock handler pipeline">
  <rect width="960" height="340" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Handler pipeline (per tick)</text>

  <rect x="24" y="146" width="110" height="56" rx="6" fill="#eef4fb" stroke="#2c7bb6" stroke-width="1.5"/>
  <text x="79" y="179" font-size="15" fill="#12324d" text-anchor="middle">Tick</text>

  <rect x="188" y="132" width="360" height="84" rx="6" fill="#eef4fb" stroke="#2c7bb6" stroke-width="1.5"/>
  <text x="368" y="166" font-size="15" fill="#12324d" text-anchor="middle">38-handler main pipeline</text>
  <text x="368" y="186" font-size="12" fill="#456" text-anchor="middle">fixed order; per-handler skip intervals</text>
  <text x="368" y="203" font-size="12" fill="#456" text-anchor="middle">(e.g. every 2, 3, 5, 10 ticks)</text>

  <rect x="608" y="60" width="330" height="86" rx="6" fill="#fbf3e8" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="773" y="88" font-size="14" fill="#6b4310" text-anchor="middle">Post-chain processors</text>
  <text x="773" y="108" font-size="12" fill="#8a5a1c" text-anchor="middle">medication administration</text>
  <text x="773" y="124" font-size="12" fill="#8a5a1c" text-anchor="middle">order completion; M&amp;M conference</text>

  <rect x="608" y="200" width="330" height="86" rx="6" fill="#fbf3e8" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="773" y="228" font-size="14" fill="#6b4310" text-anchor="middle">Event-dispatch handlers</text>
  <text x="773" y="248" font-size="12" fill="#8a5a1c" text-anchor="middle">lab / radiology results</text>
  <text x="773" y="264" font-size="12" fill="#8a5a1c" text-anchor="middle">ED discharge; surgery completion</text>

  <g stroke="#2c7bb6" stroke-width="1.6" fill="none" marker-end="url(#a2)">
    <line x1="134" y1="174" x2="184" y2="174"/>
    <path d="M548 160 L578 160 L578 103 L604 103"/>
    <path d="M548 188 L578 188 L578 243 L604 243"/>
  </g>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#2c7bb6"/></marker>
  </defs>
</svg>
